# Templates for ci jobs - test cdash
# It defines workflow rules, templates to create docker images, to configure, build siconos and so on.
include:
   - ci_gitlab/gitlab-ci-siconos-templates.yml


variables:
  PACKAGE_NAME: documentation
  # Branch name (lower-case)
  PACKAGE_VERSION: "${CI_COMMIT_REF_SLUG}"
  ARCHIVE_NAME: "documentation.tgz"


## WARNING: this branch is to be frozen to keep trace of the old master branch.
## --> CI to generate images, doc, release for the last commit in the branch before freeze
## --> CI (manual), if one day we need to re-generate things ...
## 

# An image with all options (occ, doc and so on)
# - reproducible (try to) --> digest, pin packages, lock ...
# - including everything required to compile siconos with all components
legacy-full:docker-build:
  variables:
    IMAGE_NAME: legacy-full-2026-07
    SICONOS_DOCKER_TARGET: siconos-doc
    RESULT_NAME: $SICONOS_REGISTRY/sources/legacy-full-2026-07
  extends: .docker-build
  when: manual

# -- Configure, build and test Siconos --

legacy:configure:
  variables:
    IMAGE_NAME: $SICONOS_REGISTRY/sources/legacy-full-2026-07
    CDASH_SUBMIT: 1
    CONF_FILE: $SICONOS_CMAKE_CONF_PATH/for_legacy.cmake
  extends:
    - .siconos-configure
    - .devel-rules
  needs:
    - job: legacy-full:docker-build
      optional: true

legacy:build:
  variables:
      IMAGE_NAME: $SICONOS_REGISTRY/sources/legacy-full-2026-07
      CDASH_SUBMIT: 1
  extends:
    - .siconos-build
    - .devel-rules
  needs: ["legacy:configure"]

legacy:test:
    variables:
      IMAGE_NAME: $SICONOS_REGISTRY/sources/legacy-full-2026-07
      CDASH_SUBMIT: 1
    extends:
      - .siconos-test
      - .devel-rules
    needs: ["legacy:build"]

# -- Build doc --
legacy:doc:
  image: $SICONOS_REGISTRY/sources/legacy-full-2026-07
  variables:
    OPENBLAS_NUM_THREADS: 1
  stage: doc-deploy
  artifacts:
    paths:
      - ${ARCHIVE_NAME}
    expire_in: 2 days  
  script:
      - cd build; make doc -j 32
      - cd $CI_PROJECT_DIR; tar -zcvf ${ARCHIVE_NAME} $CI_PROJECT_DIR/build/docs/build/html
      - ls -altr $CI_PROJECT_DIR/
  when: manual
  needs: ["legacy:build"]

# --- install siconos and produce a Docker image "Siconos ready" ---
mambalab:install:
    variables:
      IMAGE_NAME: siconoslab-mamba
      RESULT_NAME: $CI_REGISTRY/nonsmooth/siconos-tutorials/siconoslab
      SICONOS_DOCKER_TARGET: siconoslab
    extends:
      - .siconos-jupyterlab-install
    needs: ["legacy:build"]

# Start CI in siconos-tutorials, when required
# How? Use [with examples] in your commit message.
# Based on the specific docker image build and saved during siconos:install step.
# Examples will be executed using imag $LAB_NAME-$CI_COMMIT_REF_SLUG e.g. siconoslab-occ-main
bridge:examples:
  stage: test
  variables:
    # base name of the docker image used in child project.
    LAB_NAME: siconoslab
  trigger: 
    project: nonsmooth/siconos-tutorials
    branch: $CI_COMMIT_REF_NAME # Use a branch in siconos-tutorials with the same name as the current one --> assume it exists!
    strategy : depend
    forward :  
      #yaml_variables: true # to send LAB_NAME
      LAB_NAME: $LAB_NAME
  needs: ["mambalab:install"]
  rules: # This job starts if the commit message contains "[with examples] or may be triggered manualy"
    - if: $CI_COMMIT_MESSAGE =~ /\[with examples\]/
      when: on_success
    - when: manual    


# https://docs.gitlab.com/user/packages/generic_packages/
publish-package:
  stage: doc-deploy
  image: curlimages/curl:latest
  needs:
    - legacy:doc
  script:
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARCHIVE_NAME}"
      echo "Uploading ${ARCHIVE_NAME}"
      echo "Destination: ${PACKAGE_URL}"
      curl \
        --fail \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ${ARCHIVE_NAME} \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARCHIVE_NAME}"
# --fail --> job fails if http error during curl


# Job run when a new tag (release) is created.
# See https://docs.gitlab.com/user/project/releases/release_fields/
# Standard release + link to package registry with the documentation
release_job:
    stage: release
    image: registry.gitlab.com/gitlab-org/release-cli:latest
    rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
      when: always
    script:
    - echo "running release_job"
    release:                               # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
      tag_name: "${CI_COMMIT_TAG}"
      description: "${CI_COMMIT_REF_NAME} - Frozen documentation"
      assets: # Downloadables things on release page 
        links:
          - name: documentation.tar.gz
            url: "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${ARCHIVE_NAME}"
            filepath: "/documentation"
    needs: ["legacy:doc"]
